name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so every developer and CI format identically (see CONTRIBUTING.md).
  CLANG_FORMAT_VERSION: "18.1.8"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Layering rules
        run: python3 tools/check_layering.py
      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}" && clang-format --version
      - name: clang-format
        run: git ls-files '*.h' '*.hpp' '*.c' '*.cpp' | xargs clang-format --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-latest,  preset: debug, build: debug,      test: debug,      compilers: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { name: linux-clang,  os: ubuntu-latest,  preset: debug, build: debug,      test: debug,      compilers: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" }
          - { name: linux-asan,   os: ubuntu-latest,  preset: asan,  build: asan,       test: asan,       compilers: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { name: linux-tsan,   os: ubuntu-latest,  preset: tsan,  build: tsan,       test: tsan,       compilers: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { name: macos,        os: macos-latest,   preset: debug, build: debug,      test: debug,      compilers: "" }
          - { name: windows-msvc, os: windows-latest, preset: msvc,  build: msvc-debug, test: msvc-debug, compilers: "" }
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.compilers }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build }}
      - name: Test
        run: ctest --preset ${{ matrix.test }}

  install-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset release && cmake --build --preset release
      - run: cmake --install build/release --prefix "$PWD/stage"
      - name: find_package(FiaiSDK) from a separate project
        run: |
          cmake -S tests/package -B build/package -G Ninja -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build/package
          LD_LIBRARY_PATH="$PWD/stage/lib" ./build/package/fiaisdk_package_test
