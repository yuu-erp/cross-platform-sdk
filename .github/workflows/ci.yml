name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so every developer and CI format identically (see CONTRIBUTING.md).
  CLANG_FORMAT_VERSION: "18.1.8"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Layering rules
        run: |
          python3 tools/check_layering.py
          python3 -m unittest discover -s tools -p test_check_layering.py
      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        # Own virtualenv + absolute path: a system clang-format earlier in PATH cannot be used.
        run: |
          python3 -m venv "$RUNNER_TEMP/cf"
          "$RUNNER_TEMP/cf/bin/pip" install --quiet "clang-format==${CLANG_FORMAT_VERSION}"
          "$RUNNER_TEMP/cf/bin/clang-format" --version
      - name: clang-format
        # On failure every file that needs reformatting is reported as an annotation with the
        # first lines of the expected change, so the fix is visible without opening the log.
        run: |
          CF="$RUNNER_TEMP/cf/bin/clang-format"
          git ls-files '*.h' '*.hpp' '*.c' '*.cpp' | xargs "$CF" -i
          if ! git diff --quiet; then
            for f in $(git diff --name-only); do
              change=$(git diff -U0 -- "$f" | tail -n +5 | head -n 16 |
                sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error file=$f,title=clang-format ${CLANG_FORMAT_VERSION}::$change"
            done
            git diff --stat
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-latest,  preset: debug, build: debug,      test: debug,      compilers: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { name: linux-clang,  os: ubuntu-latest,  preset: debug, build: debug,      test: debug,      compilers: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" }
          - { name: linux-asan,   os: ubuntu-latest,  preset: asan,  build: asan,       test: asan,       compilers: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { name: linux-tsan,   os: ubuntu-latest,  preset: tsan,  build: tsan,       test: tsan,       compilers: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { name: macos,        os: macos-latest,   preset: debug, build: debug,      test: debug,      compilers: "" }
          - { name: windows-msvc, os: windows-latest, preset: msvc,  build: msvc-debug, test: msvc-debug, compilers: "" }
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install static OpenSSL 3.2+ (Linux)
        if: runner.os == 'Linux'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-linux
      - name: Configure (Linux, OpenSSL from vcpkg)
        if: runner.os == 'Linux'
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.compilers }} -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Install static OpenSSL 3 (Windows, dynamic CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_ROOT_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure (Windows, matching Debug/Release crypto libraries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --preset msvc -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
      - name: Configure
        if: runner.os == 'macOS'
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.compilers }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build }}
      - name: Test
        run: ctest --preset ${{ matrix.test }}

  install-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: '"$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-linux'
      - run: cmake --preset release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux
      - run: cmake --build --preset release
      - run: cmake --install build/release --prefix "$PWD/stage"
      - name: find_package(FiaiSDK) from a separate project
        run: |
          cmake -S tests/package -B build/package -G Ninja -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build/package
          LD_LIBRARY_PATH="$PWD/stage/lib" ./build/package/fiaisdk_package_test
